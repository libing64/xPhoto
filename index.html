<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xPhoto · RAW 自动修图</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ 加载 ============ -->
<div id="boot" class="boot">
  <div class="boot-mark">xPhoto</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-text">正在读取 out/manifest.json …</div>
</div>

<!-- ============ 相册 ============ -->
<div id="gallery" class="page hidden">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="brand-txt">
        <h1>xPhoto</h1>
        <p>RAW 自动修图 · 调色 / 降噪 / 导出</p>
      </div>
    </div>
    <div class="top-stats" id="galleryStats"></div>
  </header>

  <div class="gallery-intro">
    <div>
      <h2>本次处理结果</h2>
      <p id="gallerySub">自动分析场景 → 曝光与白平衡校正 → 分级降噪 → 通透感与锐化</p>
    </div>
    <div class="legend">
      <span class="dot auto"></span> 自动修图
      <span class="dot raw"></span> RAW 原片
    </div>
  </div>

  <main class="grid" id="grid"></main>

  <footer class="foot">
    <span>点击任意照片进入编辑器 · 可实时调节参数、拖动分割线对比原片、导出 JPEG</span>
  </footer>
</div>

<!-- ============ 编辑器 ============ -->
<div id="editor" class="editor hidden">
  <header class="ed-top">
    <button class="icon-btn" id="btnBack" title="返回相册 (Esc)">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="ed-title">
      <h2 id="edName">—</h2>
      <div class="chips" id="edExif"></div>
    </div>
    <div class="ed-actions">
      <button class="btn ghost" id="btnHold" title="按住查看 RAW 原片 (空格)">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        对比
      </button>
      <button class="btn ghost" id="btnReset" title="重置参数 (R)">重置</button>
      <button class="btn" id="btnExport" title="导出当前效果 (E)">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        导出
      </button>
    </div>
  </header>

  <div class="ed-body">
    <div class="stage" id="stage">
      <canvas id="gl"></canvas>
      <div class="split-line" id="splitLine"><i></i></div>
      <div class="stage-tag left" id="tagBefore">RAW 原片</div>
      <div class="stage-tag right" id="tagAfter">自动修图</div>
      <div class="zoom-bar">
        <button id="btnZoomOut" title="缩小">−</button>
        <span id="zoomLabel">适合</span>
        <button id="btnZoomIn" title="放大">+</button>
        <button id="btnZoomFit" title="适合窗口 (0)">适合</button>
      </div>
      <div class="stage-hint" id="stageHint">拖动分割线对比 · 滚轮缩放 · 双击复位</div>
    </div>

    <aside class="panel">
      <div class="p-sec">
        <h3>风格预设</h3>
        <div class="presets" id="presets"></div>
      </div>

      <div class="p-sec" id="sliders"></div>

      <div class="p-sec analysis">
        <h3>场景分析</h3>
        <div class="stats" id="analysis"></div>
      </div>

      <div class="p-sec">
        <h3>导出</h3>
        <button class="btn wide" id="btnExportBig">导出当前效果 · JPG</button>
        <a class="btn wide ghost" id="lnkFull" href="#" download>下载全分辨率自动图</a>
        <p class="tiny">全分辨率文件由 Python 端导出（长边 3936px, q93）。</p>
      </div>
    </aside>
  </div>

  <div class="filmstrip" id="filmstrip"></div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
